<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi página | Link in Bio</title>
  <meta name="description" content="Página personal con enlaces a mis redes sociales." />
  <meta property="og:title" content="Mi página | Link in Bio" />
  <meta property="og:description" content="Todos mis enlaces en un solo lugar." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://picsum.photos/600/315" />
  <meta name="theme-color" content="#7C3AED" />

  <!-- Fuente opcional (puedes quitar si querés 100% local) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-start:#9275d5; /* violeta */
  --bg-end:#3f3163;   /* violeta claro */
  --card-bg: rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:#E9D5FF;
  --btn:#ffffff;
  --btn-text:#5B21B6;
  --btn-hover:#F5F3FF;
  --ring: rgba(255,255,255,0.25);
  --maxw: 560px;
}

*{box-sizing:border-box}
html,body{
  height:100%;
}

body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
  color:var(--text);
  /* FONDO degradado radial + lineal */
  background:
    radial-gradient(1200px 800px at 50% -10%, var(--bg-end), transparent 60%),
    linear-gradient(180deg, var(--bg-start), var(--bg-end));
  background-attachment: fixed;     /* para que el degradado acompañe el scroll */
  display:grid;
  place-items:center;
  padding:32px 16px;
}

.wrap{width:100%;max-width:var(--maxw);text-align:center}

.profile{
  display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px
}

.avatar{
  width:180px;height:180px;border-radius:50%;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  outline:3px solid var(--ring);
}

h1{font-size:1.35rem;margin:0;font-weight:700}
.tagline{margin:0;color:var(--muted)}

.icons{display:flex;justify-content:center;gap:14px;margin:14px 0 10px}
.icons a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;background:var(--card-bg);backdrop-filter: blur(6px);transition: transform .15s ease, background .15s ease}
.icons a:hover{transform:translateY(-2px);background:rgba(255,255,255,0.2)}
.icons svg{width:22px;height:22px;fill:#fff}

.links{display:grid;gap:12px;margin-top:12px}
.link{
  display:flex;
  align-items:center;
  position:relative;
  padding:8px 16px;
  border-radius:14px;
  background:#fff;
  color:var(--btn-text);
  text-decoration:none;
  font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
}
.link:hover{
  transform: translateY(-2px);
  background: var(--btn-hover);
  box-shadow: 0 12px 34px rgba(0,0,0,.22);
}

.link img{
  width:80px;height:80px;
  border-radius:6px;
  object-fit:cover;
  margin-right:auto;
}
.link span{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:1rem;
  width:100%;
}

/* anuncios */
.ad-wrap{margin:22px auto 0;max-width:var(--maxw)}
.ad-placeholder{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:120px;
  border-radius:14px;
  border:2px dashed rgba(255,255,255,.35);
  color:rgba(255,255,255,.9);
  font-size:.95rem
}

footer{margin-top:20px;opacity:.8;font-size:.85rem}
footer a{color:#fff}

@media (max-width:420px){
  .link{padding:12px}
}


</style>

</head>
<body>
  <main class="wrap">
    <section class="profile">
      <img class="avatar" src="Fotos/Principal.png" alt="principal" />
      <h1>Natasha Mora</h1>
      <p class="tagline">It's me! Your favorite mischievous tatted girl 💙</p>
      <p class="tagline">25 - Latina - All my links HERE</p>
    </section>

    <nav class="icons" aria-label="Redes destacadas">
      <a href="https://onlyfans.com/natashamora" aria-label="OnlyFans" target="_blank" rel="noopener">
        <img src="Fotos/OnlyBlanco.png" alt="OnlyFans" width="32" height="32" />
      </a>
    </nav>

    <div class="links" role="navigation" aria-label="Enlaces principales">
      <!-- Reemplazá href con tus URLs reales -->
      <a class="link" href="https://onlyfans.com/natashamora" target="_blank" rel="noopener">
        <img src="Fotos/Only1.jpg" alt="Only" />
        <span>FREE OF ACCOUNT🔥💖</span>
      </a>
      <a class="link" href="https://onlyfans.com/natmoravip" target="_blank" rel="noopener">
        <img src="Fotos/Only2.JPG" alt="Only" />
        <span>VIP OF ACCOUNT (Trial discount up to 40%)💎</span>
      </a>
      <a class="link" href="https://www.reddit.com/user/NatashaMora/" target="_blank" rel="noopener">
        <img src="Fotos/REDDIT.jpg" alt="REDDIT" />
        <span>REDDIT📢</span>
      </a>
    </div>

    <!-- Bloque de anuncios -->
    <div class="ad-wrap">
      <!--
        ======= AdSense =======
        1) Reemplazá "ca-pub-xxxxxxxxxxxxxxxx" por tu ID de editor.
        2) Reemplazá data-ad-slot por el de tu bloque de anuncios.
        3) Este contenedor muestra un placeholder en local hasta que pegues tu código real.
      -->
      <div class="ad-placeholder">Zona de anuncio (pegar código de AdSense aquí)</div>
      <!-- EJEMPLO (descomenta cuando tengas aprobación):
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx" crossorigin="anonymous"></script>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
           data-ad-slot="1234567890"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
    </div>

    <footer>
      <p>© <span id="year"></span> Tu Nombre. Todos los derechos reservados.</p>
    </footer>
  </main>

  <script>
    // Año dinámico
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
