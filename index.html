   <script>
    // ======= SCRIPT DE TRACKING PARA PIXEL + CAPI =======
    // Función utilitaria para leer cookies (fbp/fbc)
    function getCookie(name){
      return document.cookie.split('; ')
        .find(r => r.startsWith(name+'='))?.split('=')[1];
    }

    // Selecciona todos los enlaces principales
    document.querySelectorAll('.links a').forEach(link => {
      link.addEventListener('click', async () => {
        // Genera un ID único para deduplicación
        const eventId = crypto.randomUUID();

        // Dispara el evento en el navegador (Pixel)
        fbq('track', 'Lead', {}, { eventID: eventId });

        // Si tenés configurado el Worker de Cloudflare para CAPI, descomenta:
        
        await fetch('https://natashamora.com.ar/conv', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            event_name: 'Lead',          // Nombre del evento
            event_id: eventId,           // Mismo ID que el Pixel
            url: location.href,
            fbp: getCookie('_fbp'),
            fbc: getCookie('_fbc'),
            test_event_code: 'TEST46777' // solo mientras probá 
          })
        });
      });
    });
    // ======= /SCRIPT DE TRACKING =======
  </script>

<style>
:root{
  --bg-start:#9275d5; /* violeta */
  --bg-end:#3f3163;   /* violeta claro */
  --card-bg: rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:#E9D5FF;
  --btn:#ffffff;
  --btn-text:#5B21B6;
  --btn-hover:#F5F3FF;
  --ring: rgba(255,255,255,0.25);
  --maxw: 560px;
}

*{box-sizing:border-box}
html,body{ height:100%; }

body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
  color:var(--text);
  /* FONDO degradado radial + lineal */
  background:
    radial-gradient(1200px 800px at 50% -10%, var(--bg-end), transparent 60%),
    linear-gradient(180deg, var(--bg-start), var(--bg-end));
  background-attachment: fixed;     /* para que el degradado acompañe el scroll */
  display:grid;
  place-items:center;
  padding:32px 16px;
}

.wrap{width:100%;max-width:var(--maxw);text-align:center}

.profile{
  display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px
}

.avatar{
  width:clamp(120px,24vw,180px);
  height:clamp(120px,24vw,180px);
  border-radius:50%;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  outline:3px solid var(--ring);
}

h1{font-size:clamp(1.1rem,2.4vw,1.35rem);margin:0;font-weight:700}
.tagline{margin:0;color:var(--muted);font-size:clamp(.9rem,2.1vw,1rem)}

.icons{display:flex;justify-content:center;gap:14px;margin:14px 0 10px}
.icons a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;background:var(--card-bg);backdrop-filter: blur(6px);transition: transform .15s ease, background .15s ease}
.icons a:hover{transform:translateY(-2px);background:rgba(255,255,255,0.2)}
.icons img{width:22px;height:22px}

/* ===== Lista de enlaces ===== */
.links{display:grid;gap:12px;margin-top:12px}

/* Tarjeta: pasamos a GRID (3 columnas) manteniendo tu estética
   [ miniatura | texto | espaciador ] */
.link{
  display:grid;
  grid-template-columns: clamp(56px,16vw,80px) 1fr clamp(44px,6vw,56px);
  align-items:center;
  gap: clamp(8px,2vw,12px);
  min-height: clamp(68px,15vw,96px);
  padding: clamp(8px,2.5vw,12px) clamp(12px,3.5vw,16px);
  border-radius:14px;
  background:#fff;
  color:var(--btn-text);
  text-decoration:none;
  font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  position:relative;
  overflow:hidden; /* por si algún emoji forzara overflow */
}
.link:hover{
  transform: translateY(-2px);
  background: var(--btn-hover);
  box-shadow: 0 12px 34px rgba(0,0,0,.22);
}

/* Miniatura confinada a su columna y sin baseline raro */
.link img{
  grid-column:1;
  display:block;
  width:100%;
  height:clamp(56px,14vw,80px);
  border-radius:6px;
  object-fit:cover;
  margin:0;
}

/* Texto: quitamos absolute y centramos de verdad en columna 2 */
.link span{
  grid-column:2;
  display:block;
  text-align:center;
  font-size:clamp(.95rem,3.3vw,1.05rem);
  line-height:1.28;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:normal;
  hyphens:auto;
  padding:0 .25rem;
  max-width:100%;
  z-index:0;
}

/* Espaciador derecho para mantener el centro óptico sin morder el texto */
.link::after{
  content:"";
  grid-column:3;
  width:100%; height:1px; /* invisible; sólo ocupa la columna */
}

/* anuncios */
.ad-wrap{margin:22px auto 0;max-width:var(--maxw)}
.ad-placeholder{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:120px;
  border-radius:14px;
  border:2px dashed rgba(255,255,255,.35);
  color:rgba(255,255,255,.9);
  font-size:.95rem
}

footer{margin-top:20px;opacity:.8;font-size:.85rem}
footer a{color:#fff}

/* Ajustes móviles pequeños (iPhone SE / Samsung chicos) */
@media (max-width:430px){
  .link{
    grid-template-columns: clamp(52px,18vw,68px) 1fr clamp(40px,5vw,50px);
  }
  .link img{ border-radius:6px; }
}

/* Safe areas (iPhone notch) */
@supports(padding:max(0px)){
  body{
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
  }
}
</style>

</head>
