  <style>
  :root{
    --bg-start:#9275d5; /* violeta */
    --bg-end:#3f3163;   /* violeta claro */

    --muted:#E9D5FF;

  *{box-sizing:border-box}

  body{

    color:var(--text);
    background:

    display:grid;
    place-items:center;
    padding:32px 16px;
  }

  .wrap{width:100%;max-width:var(--maxw);text-align:center}

  .profile{
    display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px
  }

  .avatar{
    width:clamp(120px,24vw,180px);
    height:clamp(120px,24vw,180px);
    border-radius:50%;object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    outline:3px solid var(--ring);
  }

  h1{font-size:clamp(1.1rem,2.4vw,1.35rem);margin:0;font-weight:700}
  .tagline{margin:0;color:var(--muted);font-size:clamp(.9rem,2.1vw,1rem)}

  .icons{display:flex;justify-content:center;gap:14px;margin:14px 0 10px}
  .icons img{width:32px;height:32px}

  /* ===== Lista de enlaces ===== */
  .links{display:grid;gap:12px;margin-top:12px}

  .link{
    display:grid;
    grid-template-columns: clamp(56px,16vw,80px) 1fr clamp(44px,6vw,56px);
    align-items:center;
    gap: clamp(8px,2vw,12px);
    min-height: clamp(68px,15vw,96px);
    padding: clamp(8px,2.5vw,12px) clamp(12px,3.5vw,16px);
    border-radius:14px;
    background:#fff;
    color:var(--btn-text);
    text-decoration:none;
    font-weight:600;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    position:relative;
    overflow:hidden;
  }
  .link:hover{
    transform: translateY(-2px);
    background: var(--btn-hover);
    box-shadow: 0 12px 34px rgba(0,0,0,.22);
  }

  .link img{
    grid-column:1;
    display:block;
    width:100%;
    height:clamp(56px,14vw,80px);
    border-radius:6px;
    object-fit:cover;
    margin:0;
  }

  .link span{
    grid-column:2;
    display:block;
    text-align:center;
    font-size:clamp(.95rem,3.3vw,1.05rem);
    line-height:1.28;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
    hyphens:auto;
    padding:0 .25rem;
    max-width:100%;
    z-index:0;
  }

  .link::after{

    width:100%; height:1px;
  }

  <!-- Año dinámico + tracking de eventos -->
  <script>
  // Año dinámico
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---- Utilidades para CAPI ----
  function sendCapi(url, payload) {
    try {
      const blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, blob);
        return;
      }
    } catch(e){}
    // Fallback
    fetch(url, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify(payload),
      keepalive: true
    });
  }

  function getCookie(name) {
    return document.cookie.split('; ').find(r => r.startsWith(name+'='))?.split('=')[1];
  }

  function trackClick(idElemento, nombreEvento) {
    const el = document.getElementById(idElemento);
    if (!el) return;

    el.addEventListener('click', function() {
      const evID = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      // Pixel (web)
      fbq('track', nombreEvento, {}, { eventID: evID });

      // CAPI → tu Worker en /conv
      const capiPayload = {
        event_name: nombreEvento,
        event_id: evID,
        url: location.href,
        fbp: getCookie('_fbp') || undefined,
        fbc: getCookie('_fbc') || undefined
      };
      sendCapi('https://natashamora.com.ar/conv', capiPayload);
    });
  }

  // Asignación de eventos (podés cambiarlos cuando quieras)
  trackClick('cta-free',  'ViewContent');
  trackClick('cta-vip',   'Lead');
  trackClick('cta-reddit','ViewContent');
  </script>
